services:
  backend:
    build:
      context: ./back
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=django-insecure-change-me-in-production
      - DEBUG=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    restart: unless-stopped

  frontend:
    build:
      context: ./front
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://backend:8000
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
