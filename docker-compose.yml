services:
  backend:
    build:
      context: ./back
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=*
      - CORS_ALLOWED_ORIGINS=*
      - CSRF_TRUSTED_ORIGINS=http://82.25.75.110:8000,http://82.25.75.110:3001
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL:-admin@almox.com}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD:-Admin@1234}
    volumes:
      - sqlite_data:/app/data
    restart: always

  frontend:
    build:
      context: ./front
      args:
        - BACKEND_URL=http://backend:8000
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: always

volumes:
  sqlite_data:
