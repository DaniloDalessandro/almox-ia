services:
  backend:
    build:
      context: ./back
    ports:
      - "8000:8000"
    volumes:
      - ./back:/app
    environment:
      - SECRET_KEY=${SECRET_KEY:-django-insecure-change-me-in-production}
      - DEBUG=${DEBUG:-False}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend}

  frontend:
    build:
      context: ./front
    ports:
      - "3000:3000"
    volumes:
      - ./front/src:/app/src
      - ./front/public:/app/public
    environment:
      - BACKEND_URL=http://backend:8000
      - WATCHPACK_POLLING=true
    depends_on:
      - backend
